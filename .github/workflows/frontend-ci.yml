name: Frontend CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - develop
      - master
      - frontend/dev
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - master
      - frontend/dev
  workflow_dispatch:

jobs:
  frontend-lint-test-build:
    name: Frontend Lint Test Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check frontend project
        id: frontend-check
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "frontend/package.json does not exist yet. Skip frontend CI."
          fi

      - name: Set up Node.js
        if: steps.frontend-check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.frontend-check.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Check frontend scripts
        if: steps.frontend-check.outputs.exists == 'true'
        id: frontend-scripts
        working-directory: frontend
        run: |
          node -e "const fs = require('fs'); const scripts = JSON.parse(fs.readFileSync('package.json', 'utf8')).scripts || {}; const out = process.env.GITHUB_OUTPUT; fs.appendFileSync(out, 'lint=' + Boolean(scripts.lint) + '\n'); fs.appendFileSync(out, 'test_run=' + Boolean(scripts['test:run']) + '\n');"

      - name: Run frontend lint
        if: steps.frontend-check.outputs.exists == 'true' && steps.frontend-scripts.outputs.lint == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Skip frontend lint
        if: steps.frontend-check.outputs.exists == 'true' && steps.frontend-scripts.outputs.lint != 'true'
        run: echo "frontend/package.json does not define a lint script yet. Skip lint until Issue #5 adds it."

      - name: Run frontend tests
        if: steps.frontend-check.outputs.exists == 'true' && steps.frontend-scripts.outputs.test_run == 'true'
        working-directory: frontend
        run: npm run test:run

      - name: Skip frontend tests
        if: steps.frontend-check.outputs.exists == 'true' && steps.frontend-scripts.outputs.test_run != 'true'
        run: echo "frontend/package.json does not define a test:run script yet. Skip tests until Issue #5 adds it."

      - name: Build frontend
        if: steps.frontend-check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build

      - name: Upload frontend dist
        if: steps.frontend-check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
